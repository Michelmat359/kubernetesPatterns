# Despliegue Kubernetes para el Patrón 3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-loading-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-loading
  template:
    metadata:
      labels:
        app: dynamic-loading
    spec:
      containers:
      - name: dynamic-loader
        image: myregistry/ros-dynamic:latest
        env:
        - name: MODEL_URL
          value: "https://example.com/models/latest"
        # El contenedor descarga el modelo en el arranque
