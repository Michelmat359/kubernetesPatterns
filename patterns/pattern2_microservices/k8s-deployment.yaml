# Despliegue Kubernetes para el Patrón 2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservices-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices
  template:
    metadata:
      labels:
        app: microservices
    spec:
      containers:
      - name: perception
        image: myregistry/ros-perception:latest
        # Contenedor especializado en tareas de visión
      - name: controller
        image: myregistry/ros-controller:latest
        # Contenedor que coordina el robot y se comunica con el resto
